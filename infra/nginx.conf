server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Next.js static export writes each route as a flat <route>.html file
    # (e.g. partners.html, partners/corporate-marketer.html) alongside a
    # same-named directory holding prefetch payloads - so $uri.html must be
    # checked before $uri/, otherwise nginx matches the payload directory
    # first and 403s instead of falling through to the page.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Next.js build output - hashed filenames, safe to cache for a long time
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Cache other static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
