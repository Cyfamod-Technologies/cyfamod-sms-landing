name: Self-Hosted Runner Test

# Throwaway smoke test for the new self-hosted runner - NOT wired into the
# real deploy workflow yet. Manual trigger only, does nothing but report
# which machine actually picked up the job. Safe to delete once confirmed.

on:
  workflow_dispatch:

concurrency:
  group: self-hosted-runner-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Report runner identity
    runs-on: [self-hosted, cyfamod]
    timeout-minutes: 5
    steps:
      - name: Who picked this up?
        run: |
          echo "RUNNER_NAME:  $RUNNER_NAME"
          echo "RUNNER_OS:    $RUNNER_OS"
          echo "RUNNER_ARCH:  $RUNNER_ARCH"
          echo "hostname:     $(hostname)"
          echo "uname -a:     $(uname -a)"
          echo "whoami:       $(whoami)"
          echo "pwd:          $(pwd)"
          echo "date:         $(date)"
